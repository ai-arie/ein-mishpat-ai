[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ein_mishpat_ai"
version = "0.0.1"
description = "Open retrieval models and the KesherBench benchmark for Jewish texts (Hebrew, Aramaic, English)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
data = [
  "requests",
  "tenacity",
  "tqdm",
  "pyarrow",
  "polars",
  "pyyaml",
  "huggingface_hub",
  "regex",
]
train = [
  "transformers>=4.51,<5",       # 5.x needs torch>=2.6; image has 2.3
  "sentence-transformers>=3,<6",
  "peft",
  "accelerate",
  "datasets",
  "numpy",
  "mlflow",
]
eval = ["faiss-cpu", "bm25s", "scikit-learn"]
dev = ["pytest", "ruff", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format handles code; long strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
